<!doctype html>
<html lang="zh-CN" data-platform="darwin">
	<head>
		<meta charset="utf-8" />
		<title>sidebar drawer harness</title>
		<style>
			/* Mirrors the shipped AppFrame/SidebarRoot boxes: the frame owns the grid,
			   animates its column track, and the sidebar column clips its content. */
			html,
			body {
				height: 100%;
				margin: 0;
				background: #16181d;
				color: #e8eaed;
				font: 14px/1.4 -apple-system, system-ui, sans-serif;
			}
			#frame {
				display: grid;
				grid-template-rows: 100%;
				height: 100%;
				position: relative;
				overflow: hidden;
			}
			/* The shipped app's document scrolls in some views — the reported "scrolling
			   inside the drawer retracts it" case. A spacer below the frame gives this
			   harness a real scrollable document, so a wheel scroll is a real viewport
			   change with real reflow, not a synthetic event. */
			#scrollSpacer {
				height: 400px;
			}
			/* Shipped values: --ds-transition-duration-slow = .3s, --ds-ease-in-out =
			   cubic-bezier(.4,0,.2,1). A duration that disagrees with the marker model
			   below puts the harness in a state the shell never produces. */
			#frame[data-animating] {
				transition: grid-template-columns 300ms cubic-bezier(0.4, 0, 0.2, 1);
			}
			#frame[data-dragging] {
				transition: none;
			}
			@media (prefers-reduced-motion: reduce) {
				#frame[data-animating] {
					transition: none;
				}
			}
			#sidebarCol {
				background: #1c1f26;
				border-right: 0.5px solid #2b2f38;
				min-width: 0;
				overflow: hidden;
			}
			/* The shipped darwin rule drops the border, which is what makes the collapsed
			   column measure exactly 0px. Without it the column measures 1px, and the
			   plugin's `width <= 0.5` early-out takes the opposite branch. */
			html[data-platform="darwin"] #sidebarCol {
				border-right: none;
			}
			#rightbarCol {
				min-width: 0;
				overflow: hidden;
			}
			#centerCol {
				background: #101216;
				display: flex;
				flex-direction: column;
				min-width: 0;
				overflow: hidden;
			}
			#overlay {
				position: absolute;
				inset: 0;
				z-index: 20;
				pointer-events: none;
			}
			#overlay > * {
				pointer-events: auto;
			}
			#leading {
				position: absolute;
				top: 11px;
				left: 88px;
				z-index: 15;
				display: flex;
				align-items: center;
			}
			#handle {
				position: absolute;
				top: 0;
				bottom: 0;
				width: 8px;
				margin-left: -4px;
				z-index: 11;
				cursor: col-resize;
			}
			.pad {
				padding: 16px;
			}
			#log {
				font: 12px/1.5 ui-monospace, monospace;
				white-space: pre-wrap;
				color: #9fd3ff;
			}
			.sideRow {
				padding: 8px 12px;
				border-radius: 6px;
			}
			.sideRow:hover {
				background: #262b34;
			}
		</style>
	</head>
	<body data-ds-dark-theme>
		<div id="frame" data-sidebar-collapsed="true">
			<div id="sidebarCol">
				<!-- The shipped sidebar keeps its own fixed width inside the clipping
				     column, so the inner box is wide even while the column is 0px. -->
				<div id="sidebarRoot" style="width: 280px; height: 100%; box-sizing: border-box">
					<div class="sideRow" id="row1">会话 A</div>
					<div class="sideRow" id="row2">会话 B</div>
					<div class="sideRow" id="row3">会话 C</div>
				</div>
			</div>
			<div id="centerCol">
				<div class="pad">中间内容列 —— 指针移到这里应当收回抽屉。</div>
				<pre id="log"></pre>
			</div>
			<div id="rightbarCol" data-rightbar-col></div>
			<!-- The shipped frame renders its overlay layer unconditionally, between the
			     center/right columns and the leading seat. It is one of only two markers
			     that survive the sidebar opening, so omitting it leaves the drawer with
			     no anchor at all once the drawer is open. -->
			<div id="overlay" data-shell-overlay></div>
			<div id="leading" data-shell-leading=""></div>
			<!-- The shipped sidebar drag handle publishes its side and is mounted only
			     while the sidebar is open. -->
			<div id="handle" data-side="sidebar"></div>
		</div>
		<div id="scrollSpacer"></div>

		<script>
			/* Stand-in for the shipped layout store: the sidebar preference IS the
			   column width, and the frame animates every discrete change. */
			const frame = document.getElementById("frame");
			const sidebarCol = document.getElementById("sidebarCol");
			const handle = document.getElementById("handle");
			const leading = document.getElementById("leading");
			const SIDEBAR_WIDTH = 280;
			const COLLAPSED_WIDTH = 0; /* darwin desktop hides the column entirely */
			let sidebar = 0;
			let viewport = window.innerWidth;

			const events = [];
			function log(line) {
				events.push(line);
				document.getElementById("log").textContent = events.join("\n");
			}

			/* React renders `sidebarCollapsed || void 0`: the literal "true" while collapsed,
			   and no attribute at all while open. `toggleAttribute(name, true)` would write
			   "" instead — and the plugin compares the value against "true", so re-adding the
			   marker that way leaves drawerIsClosed() answering false for the rest of the
			   session while the shell would answer true. */
			function setCollapsedMarker(collapsed) {
				if (collapsed) frame.setAttribute("data-sidebar-collapsed", "true");
				else frame.removeAttribute("data-sidebar-collapsed");
			}

			/* The shipped frame clears the marker on transitionend for the
			   grid-template-columns property, with a 600ms cap in case it never lands.
			   A timer-only model holds the marker long past its own transition end. */
			let animationTimer = null;
			function stopAnimatingMarker() {
				if (animationTimer !== null) {
					window.clearTimeout(animationTimer);
					animationTimer = null;
				}
				frame.removeAttribute("data-animating");
			}
			function startAnimatingMarker() {
				frame.setAttribute("data-animating", "true");
				if (animationTimer !== null) window.clearTimeout(animationTimer);
				animationTimer = window.setTimeout(stopAnimatingMarker, 600);
			}
			frame.addEventListener("transitionend", (event) => {
				if (event.target !== frame || event.propertyName !== "grid-template-columns") return;
				stopAnimatingMarker();
			});

			function applyColumns(animate) {
				const width = sidebar === 0 ? COLLAPSED_WIDTH : SIDEBAR_WIDTH;
				if (animate) startAnimatingMarker();
				frame.style.gridTemplateColumns = `${width}px minmax(0, 1fr) minmax(0px, 0px)`;
				setCollapsedMarker(sidebar === 0);
				syncLeading();
				syncHandle();
			}

			const layout = {
				get panelInfo() {
					return { activePanelId: null };
				},
				toggleSidebar() {
					sidebar = sidebar === 0 ? SIDEBAR_WIDTH : 0;
					log(`toggleSidebar -> sidebar=${sidebar}`);
					applyColumns(true);
				},
				selectPanel() {},
				beginNavigation() {
					return new AbortController().signal;
				}
			};

			/* The shipped sidebar handle is mounted only while the sidebar is open, and its
			   `left` tracks the live column width. A permanently mounted handle parked at
			   left:0 straddles the reveal strip in every state — a state the shell never
			   produces, and one that makes the plugin's whole handle branch unreachable. */
			function syncHandle() {
				const open = sidebar !== 0;
				if (open && handle.parentElement === null) frame.appendChild(handle);
				else if (!open && handle.parentElement !== null) handle.remove();
				handle.style.left = `${open ? SIDEBAR_WIDTH : COLLAPSED_WIDTH}px`;
			}

			/* The shipped DragHandle publishes `data-dragging` on the frame for the
			   duration of its pointer capture. */
			handle.addEventListener("pointerdown", (event) => {
				handle.setPointerCapture(event.pointerId);
				frame.setAttribute("data-dragging", "true");
				log("drag start");
			});
			for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
				handle.addEventListener(type, () => {
					if (!frame.hasAttribute("data-dragging")) return;
					frame.removeAttribute("data-dragging");
					log("drag end");
				});
			}

			/* The shipped frame mounts its leading seat only while the sidebar is
			   collapsed (`leadingMounted = darwin && sidebarCollapsed`), so the
			   `data-shell-leading` anchor leaves the document the moment the drawer
			   opens — as does `data-sidebar-collapsed` itself, since React drops an
			   attribute set to `undefined`. Both are anchors the drawer resolves its
			   frame through, so a harness that keeps this element permanently
			   mounted is not faithful: it silently rescues the lookup in the one
			   state that matters, and every open-drawer case passes for free. */
			function syncLeading() {
				const collapsed = sidebar === 0;
				if (collapsed && leading.parentElement === null) frame.insertBefore(leading, handle);
				else if (!collapsed && leading.parentElement !== null) leading.remove();
			}

			window.addEventListener("resize", () => {
				viewport = window.innerWidth;
			});
			applyColumns(false);

			/* Test surface for the driving agent. */
			window.__harness = {
				layout,
				events,
				state() {
					return {
						sidebar,
						/* Read the VALUE, not the presence: the plugin compares against the
						   literal "true", so a presence check here would report a faithful
						   collapsed state even when the marker's value had drifted. */
						collapsed: frame.getAttribute("data-sidebar-collapsed") === "true",
						columnWidth: sidebarCol.getBoundingClientRect().width,
						animating: frame.hasAttribute("data-animating"),
						dragging: frame.hasAttribute("data-dragging"),
						handleMounted: handle.parentElement !== null,
						leadingMounted: leading.parentElement !== null
					};
				},
				marker() {
					return document.documentElement.hasAttribute("dsh-sidebar-drawer");
				},
				log
			};
		</script>

		<!-- The client bundle under test, served from the repo by the agent. -->
		<script type="module">
			const params = new URLSearchParams(location.search);
			const url = params.get("plugin");
			if (url === null) {
				log("no ?plugin= parameter: harness only");
			} else {
				/* Probe surface: lets a failing case say what the page actually saw. */
				const probe = { pointerMoves: [], checks: 0 };
				window.__probe = probe; window.__trace = [];
				document.addEventListener("pointermove", (event) => {
					probe.pointerMoves.push([event.clientX, event.clientY]);
				});
				const bridge = {
					__ModuleLoader__: {
						load(record) {
							window.__module = record;
							window.__exports = record.factory(() => {
								throw new Error("bundle must not require anything");
							});
							window.__exports.apply({
								get: (name) => (name === "layout" ? window.__harness.layout : undefined),
								effect: (callback) => {
									probe.checks += 1;
									return callback();
								}
							});
							log(`module ${record.id} loaded; marker=${window.__harness.marker()}`);
						}
					}
				};
				Object.defineProperty(window, "__ModuleLoader__", { value: bridge.__ModuleLoader__, configurable: true });
				await import(url);
			}
		</script>
	</body>
</html>
